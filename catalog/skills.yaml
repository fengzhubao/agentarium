  - id: SKL-0003
    slug: skill-quality-auditor
    title: Skill Quality Auditor
    category: quality
    scope: shared
    status: sampled
    status_note: "Current shared package has bilingual public-safe sample inputs and outputs; target-agent trial evidence is pending."
    summary_zh: "审计 Skill 包的结构、触发描述、双语一致性、示例、断链和公开安全风险。"
    summary_en: "Audits Skill package structure, trigger descriptions, locale parity, examples, broken links, and public-safety risks."
    model_fit:
      suitable_for:
        - "Agents that can read repository files, compare catalog metadata with package files, and report findings without editing by default."
        - "Models with structured review, link/path checking, bilingual parity judgment, and public-safety risk analysis."
      not_suitable_for:
        - "Models without file access when the audit requires checking real paths, references, or examples."
        - "Agents that cannot separate read-only findings from requested fixes."
    supported_tools:
      - shared
    target_tools:
      - trae
      - codex
      - claude
    required_locales:
      - zh_CN
      - en_US
    variants:
      - tool: shared
        status: sampled
        status_note: "Bilingual audit workflow, references, and samples exist; real target-agent trial evidence is pending."
        package_root: skills/shared/skill-quality-auditor
        readme_file: skills/shared/skill-quality-auditor/README.md
        status_file: skills/shared/skill-quality-auditor/STATUS.md
        examples_root: examples/shared/skill-quality-auditor
        locale_roots:
          zh_CN:
            status: sampled
            import_root: skills/shared/skill-quality-auditor/zh_CN
            skill_file: skills/shared/skill-quality-auditor/zh_CN/SKILL.md
            examples_root: examples/shared/skill-quality-auditor/zh_CN
            evidence:
              sample_input: examples/shared/skill-quality-auditor/zh_CN/sample-input.md
