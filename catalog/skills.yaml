schema_version: 2
id_policy:
  pattern: "^SKL-[0-9]{4}$"
  scope: "Global stable Skill IDs. Tool families are recorded separately."
  allocation: "Use the next unused numeric ID. Do not encode tool family names in IDs."
status_policy: catalog/status-policy.md
required_locales:
  - zh_CN
  - en_US
tool_families:
  - shared
  - trae
  - claude
  - codex
skills:
  - id: SKL-0001
    slug: solo-project-publisher
    title: SOLO Project Publisher
    category: publishing
    scope: shared
    status: draft
    status_note: "zh_CN is trial-validated; en_US is draft. Overall status is conservative across required locales."
    summary_zh: "将真实项目证据整理成社区帖、比赛投稿或项目报告。"
    summary_en: "Turns real project evidence into a publishable community post or project report."
    model_fit:
      suitable_for:
        - "Agents that can load a local SKILL.md package and read user-provided repository files, notes, screenshots, or command outputs."
        - "Models with strong summarization, public-writing, evidence synthesis, and safety-review ability."
      not_suitable_for:
        - "Chat-only models without file or evidence access when the user expects evidence-backed claims."
        - "Agents that cannot keep private paths, credentials, screenshots, and account details out of public drafts."
    supported_tools:
      - trae
    target_tools:
      - trae
    required_locales:
      - zh_CN
      - en_US
    variants:
      - tool: trae
        status: draft
        status_note: "zh_CN is trial-validated; en_US is draft."
        package_root: skills/trae/solo-project-publisher
        readme_file: skills/trae/solo-project-publisher/README.md
        status_file: skills/trae/solo-project-publisher/STATUS.md
        examples_root: examples/trae/solo-project-publisher
        locale_roots:
          zh_CN:
            status: trial-validated
            import_root: skills/trae/solo-project-publisher/zh_CN
            skill_file: skills/trae/solo-project-publisher/zh_CN/SKILL.md
            examples_root: examples/trae/solo-project-publisher/zh_CN
            evidence:
              sample_input: examples/trae/solo-project-publisher/zh_CN/sample-input.md
              sample_output: examples/trae/solo-project-publisher/zh_CN/sample-output.md
              trial_output: examples/trae/solo-project-publisher/zh_CN/real-trial-output.md
              final_post: examples/trae/solo-project-publisher/zh_CN/final-forum-post.md
              trial_note: skills/trae/solo-project-publisher/STATUS.md
          en_US:
            status: draft
            import_root: skills/trae/solo-project-publisher/en_US
            skill_file: skills/trae/solo-project-publisher/en_US/SKILL.md
            examples_root: examples/trae/solo-project-publisher/en_US
            evidence:
              sample_input: examples/trae/solo-project-publisher/en_US/sample-input.md
              sample_output: examples/trae/solo-project-publisher/en_US/sample-output.md
    tags:
      - publishing
      - evidence
      - public-safety

  - id: SKL-0002
    slug: worktree-conductor
    title: Worktree Conductor
    category: development
    scope: shared
    status: sampled
    status_note: "Bilingual public-safe sample inputs and outputs exist for the shared package; real target-agent trial evidence is pending."
    summary_zh: "规划多 agent 或多人协作下的 Git worktree 并行开发。"
    summary_en: "Plans safe parallel development across Git worktrees, branches, and agents."
    model_fit:
      suitable_for:
        - "Code-capable agents that can inspect repository structure, reason about Git branches/worktrees, and produce safe task handoff prompts."
        - "Models with reliable multi-step planning, conflict-risk analysis, and command-safety judgment."
      not_suitable_for:
        - "Chat-only models without repository context for real worktree planning."
        - "Agents that cannot distinguish safe planning from directly running destructive Git commands."
    supported_tools:
      - shared
    target_tools:
      - trae
      - codex
      - claude
    required_locales:
